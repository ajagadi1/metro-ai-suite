# MediaMTX RTSP Server configuration for the sample-video evaluation and tests
# Receives ffmpeg push stream and serves as RTSP source for stream_monitor + dashboard

# Disable API and metrics (not needed here)
api: false
metrics: false

# RTSP server on default port
rtsp: true
rtspAddress: :8554

# Disable other protocols (only need RTSP)
rtmp: false
hls: false
webrtc: false
srt: false

paths:
  # RTSP paths used by run_eval.sh and scripts/test-videostream-analytics.sh,
  # published by ffmpeg loop services.
  live/sample:
    source: publisher
  live/sample_nopf:
    source: publisher
